name: analisis
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "index.html"
jobs:
  bonoloto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python analyze_web.py
      - name: Publicar JSON si cambió
        run: |
          git add data/bonoloto.json
          git diff --cached --quiet && exit 0
          git -c user.name="bonoloto-bot" -c user.email="actions@users.noreply.github.com" commit -m "Actualiza el analisis de Bonoloto"
          git push
